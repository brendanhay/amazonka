name: build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    branches: main

  push:
    branches: main
    paths-ignore:
      - "configs/**"
      - "scripts/**"
      - ".envrc"
      - ".gitignore"
      - "LICENSE"
      - "**.md"

permissions: {}

jobs:
  workflows:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.32.0
          advanced-security: false
          annotations: true

  amazonka-gen:
    strategy:
      fail-fast: false

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: amazonka
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: nix build

  amazonka-lib:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            ghc: ghc914 # Latest GHC
          - os: ubuntu-latest
            ghc: ghc910 # GHCup recommended

          - os: macos-latest
            ghc: ghc910 # GHCup recommended

    runs-on: ${{ matrix.os }}

    permissions:
      contents: read

    env:
      DEVSHELL: .#${{ matrix.ghc }}

    steps:
      - if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |-
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL &

      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: amazonka
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: cabal update && cabal freeze --enable-tests --disable-optimization
        run: |
          nix develop "$DEVSHELL" --print-build-logs --command \
              bash -c 'cabal update && cabal freeze --enable-tests --disable-optimization'

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: v2-${{ runner.os }}-${{ matrix.ghc }}-${{ hashFiles('cabal.project.freeze') }}
          restore-keys: |
            v2-${{ runner.os }}-${{ matrix.ghc }}-
          path: |
            ~/.local/state/cabal/store
            dist-newstyle

      - name: cabal build core
        run: |
          nix develop "$DEVSHELL" --print-build-logs --command \
              bash -c 'cabal build --enable-tests --disable-optimization amazonka-core amazonka'

      - name: cabal build s3-encryption
        run: |
          nix develop "$DEVSHELL" --print-build-logs --command \
              bash -c 'cabal build --enable-tests --disable-optimization amazonka-s3-encryption'

      - name: cabal build all
        run: |
          nix develop "$DEVSHELL" --print-build-logs --command \
              bash -c 'cabal test --enable-tests --disable-optimization all'
